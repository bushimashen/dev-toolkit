<script>
/* ================= 核心算法库（内联，源自站内 devKitLib.js） ================= */
/**
 * 开发者工具箱 · 纯逻辑库
 * 全部函数零依赖、纯浏览器端执行；不引入任何第三方库。
 * 密码学相关：哈希走 Web Crypto（SFC 内调用），MD5 为内置实现（Web Crypto 不提供）。
 */

/* ============ Base64（UTF-8 安全；分片避免大字符串爆栈） ============ */

function b64Encode(str) {
  const bytes = new TextEncoder().encode(String(str ?? ''))
  let bin = ''
  const CH = 0x8000
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH))
  }
  return btoa(bin)
}

function b64Decode(s) {
  const bin = atob(String(s || '').replace(/\s+/g, ''))
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0))
  return new TextDecoder().decode(bytes)
}

function b64UrlDecode(s) {
  return b64Decode(String(s || '').replace(/-/g, '+').replace(/_/g, '/'))
}

/* ============ MD5（按 RFC 1321 标准算法实现，常量表按定义运行时生成） ============ */

function md5(input) {
  const msg = new TextEncoder().encode(String(input ?? ''))
  const len = msg.length
  // 填充到 56 (mod 64)，再留 8 字节小端长度
  const padded = new Uint8Array((((len + 8) >> 6) + 1) << 6)
  padded.set(msg)
  padded[len] = 0x80
  const dv = new DataView(padded.buffer)
  dv.setUint32(padded.length - 8, (len << 3) >>> 0, true)
  dv.setUint32(padded.length - 4, Math.floor(len / 536870912) >>> 0, true)

  const S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21]
  const K = new Uint32Array(64)
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296)

  const rotl = (x, c) => (((x << c) | (x >>> (32 - c))) >>> 0)
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476

  for (let off = 0; off < padded.length; off += 64) {
    const M = new Uint32Array(16)
    for (let j = 0; j < 16; j++) M[j] = dv.getUint32(off + j * 4, true)
    let A = a0, B = b0, C = c0, D = d0
    for (let i = 0; i < 64; i++) {
      let F, g
      if (i < 16) { F = (B & C) | (~B & D); g = i }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16 }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16 }
      else { F = C ^ (B | ~D); g = (7 * i) % 16 }
      F = (F + A + K[i] + M[g]) >>> 0
      A = D
      D = C
      C = B
      B = (B + rotl(F, S[(i >> 4) * 4 + (i % 4)])) >>> 0
    }
    a0 = (a0 + A) >>> 0
    b0 = (b0 + B) >>> 0
    c0 = (c0 + C) >>> 0
    d0 = (d0 + D) >>> 0
  }
  const toHexLE = (n) => {
    let s = ''
    for (let i = 0; i < 4; i++) s += (n >>> (i * 8) & 0xff).toString(16).padStart(2, '0')
    return s
  }
  return toHexLE(a0) + toHexLE(b0) + toHexLE(c0) + toHexLE(d0)
}

/* ============ JWT（仅解码，不验签） ============ */

function jwtDecode(token) {
  const t = String(token || '').trim()
  const parts = t.split('.')
  if (parts.length < 2 || parts.length > 3) throw new Error('JWT 应为 2~3 段点分结构')
  let header, payload
  try {
    header = JSON.parse(b64UrlDecode(parts[0]))
  } catch (e) {
    throw new Error('Header 段不是有效的 base64url JSON')
  }
  try {
    payload = JSON.parse(b64UrlDecode(parts[1]))
  } catch (e) {
    throw new Error('Payload 段不是有效的 base64url JSON')
  }
  return { header, payload, signature: parts[2] || '' }
}

const HUMAN_ZH = (n, unit) => {
  if (n >= 86400) return Math.floor(n / 86400) + ' 天'
  if (n >= 3600) return Math.floor(n / 3600) + ' 小时 ' + Math.floor((n % 3600) / 60) + ' 分'
  if (n >= 60) return Math.floor(n / 60) + ' 分 ' + (n % 60) + ' 秒'
  return n + ' 秒'
}

// 相对现在的过期状态描述
function jwtTimeState(payload, now = Date.now()) {
  const out = []
  for (const [key, label] of [['iat', '签发于'], ['nbf', '生效于'], ['exp', '过期于']]) {
    const v = payload?.[key]
    if (typeof v !== 'number') continue
    const d = new Date(v * 1000)
    const diff = (v * 1000 - now) / 1000
    let rel
    if (key === 'exp') rel = diff > 0 ? '（还有 ' + HUMAN_ZH(Math.round(diff)) + '）' : '（已过期 ' + HUMAN_ZH(Math.round(-diff)) + '）'
    else rel = diff > 0 ? '（还有 ' + HUMAN_ZH(Math.round(diff)) + ' 生效）' : '（' + HUMAN_ZH(Math.round(-diff)) + '前）'
    out.push({ key, label, date: d.toLocaleString(), rel, expired: key === 'exp' && diff <= 0 })
  }
  return out
}

/* ============ 文本 Diff（行级 LCS；超长截断保护） ============ */

const DIFF_CAP = 2000

function lineDiff(aText, bText) {
  let A = String(aText ?? '').split('\n')
  let B = String(bText ?? '').split('\n')
  let truncated = false
  if (A.length > DIFF_CAP || B.length > DIFF_CAP) {
    A = A.slice(0, DIFF_CAP)
    B = B.slice(0, DIFF_CAP)
    truncated = true
  }
  const n = A.length, m = B.length
  // LCS 长度表（滚动数组回溯需要完整表，用 Int32Array 控制内存）
  const dp = new Int32Array((n + 1) * (m + 1))
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i * (m + 1) + j] = A[i] === B[j]
        ? dp[(i + 1) * (m + 1) + j + 1] + 1
        : Math.max(dp[(i + 1) * (m + 1) + j], dp[i * (m + 1) + j + 1])
    }
  }
  const ops = []
  let i = 0, j = 0
  while (i < n && j < m) {
    if (A[i] === B[j]) { ops.push({ type: ' ', text: A[i] }); i++; j++ }
    else if (dp[(i + 1) * (m + 1) + j] >= dp[i * (m + 1) + j + 1]) { ops.push({ type: '-', text: A[i] }); i++ }
    else { ops.push({ type: '+', text: B[j] }); j++ }
  }
  while (i < n) { ops.push({ type: '-', text: A[i] }); i++ }
  while (j < m) { ops.push({ type: '+', text: B[j] }); j++ }
  return { ops, truncated }
}

/* ============ 颜色转换 ============ */

function parseColor(input) {
  const s = String(input || '').trim().toLowerCase()
  let m
  if ((m = s.match(/^#?([0-9a-f]{3})$/))) {
    const [r, g, b] = m[1].split('').map(c => parseInt(c + c, 16))
    return { r, g, b }
  }
  if ((m = s.match(/^#?([0-9a-f]{6})$/))) {
    const n = parseInt(m[1], 16)
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }
  }
  if ((m = s.match(/^rgba?\(\s*(\d+)\s*[,\s]\s*(\d+)\s*[,\s]\s*(\d+)/))) {
    return { r: +m[1], g: +m[2], b: +m[3] }
  }
  if ((m = s.match(/^hsla?\(\s*(\d+)\s*[,\s]\s*(\d+)%?\s*[,\s]\s*(\d+)%?/))) {
    return hslToRgb(+m[1], +m[2], +m[3])
  }
  return null
}

function hslToRgb(h, s, l) {
  s /= 100
  l /= 100
  const k = n => (n + h / 30) % 12
  const a = s * Math.min(l, 1 - l)
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))
  return { r: Math.round(f(0) * 255), g: Math.round(f(8) * 255), b: Math.round(f(4) * 255) }
}

function rgbToHsl({ r, g, b }) {
  r /= 255
  g /= 255
  b /= 255
  const max = Math.max(r, g, b), min = Math.min(r, g, b)
  const l = (max + min) / 2
  let h = 0, s = 0
  if (max !== min) {
    const d = max - min
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60
    else if (max === g) h = ((b - r) / d + 2) * 60
    else h = ((r - g) / d + 4) * 60
  }
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) }
}

function colorForms({ r, g, b }) {
  const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('')
  const hsl = rgbToHsl({ r, g, b })
  return {
    hex,
    rgb: `rgb(${r}, ${g}, ${b})`,
    hsl: `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`,
    luminance: (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255
  }
}

/* ============ 大小写 / 命名风格转换 ============ */

function toWords(str) {
  return String(str ?? '')
    .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
    .split(/[^A-Za-z0-9\u4e00-\u9fff]+/)
    .filter(Boolean)
}

function nameCases(str) {
  const w = toWords(str)
  const lower = w.map(x => x.toLowerCase())
  const cap = lower.map(x => x.charAt(0).toUpperCase() + x.slice(1))
  const join = (arr, sep) => arr.join(sep)
  return {
    lower: join(lower, ' '),
    upper: join(lower, ' ').toUpperCase(),
    camel: lower.map((x, i) => i === 0 ? x : cap[i]).join('') || str,
    pascal: cap.join(''),
    snake: lower.join('_'),
    kebab: lower.join('-'),
    constant: lower.join('_').toUpperCase()
  }
}

/* ============ 转义 ============ */

const HTML_ENT = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }
const HTML_UNENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ' }

function htmlEscape(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => HTML_ENT[c])
}

function htmlUnescape(s) {
  return String(s ?? '')
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))
    .replace(/&([a-z]+);/gi, (m0, name) => HTML_UNENT[String(name).toLowerCase()] ?? m0)
}

function jsonEscape(s) {
  return JSON.stringify(String(s ?? '')).slice(1, -1)
}

function jsonUnescape(s) {
  return JSON.parse('"' + String(s ?? '') + '"')
}

/* ============ 进制转换（BigInt 支持超长整数） ============ */

const RADIX_DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz'

function convertRadix(str, from, to) {
  const s = String(str ?? '').trim().toLowerCase().replace(/^0+(?=.)/, '')
  if (!s || s === '-') throw new Error('输入为空')
  const neg = s.startsWith('-')
  const body = neg ? s.slice(1) : s
  let n = 0n
  for (const ch of body) {
    const d = RADIX_DIGITS.indexOf(ch)
    if (d < 0 || d >= from) throw new Error(`「${ch}」不是 ${from} 进制的合法字符`)
    n = n * BigInt(from) + BigInt(d)
  }
  if (n === 0n) return '0'
  let out = ''
  const tb = BigInt(to)
  while (n > 0n) {
    out = RADIX_DIGITS[Number(n % tb)] + out
    n /= tb
  }
  return (neg ? '-' : '') + out
}

/* ============ Crontab 解析（5 字段 + Vixie 日/周 OR 语义） ============ */

const MONTH_NAMES = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec']
const DOW_NAMES = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat']
const CRON_RANGES = [
  [0, 59], // 分
  [0, 23], // 时
  [1, 31], // 日
  [1, 12], // 月
  [0, 7]   // 周（7 视作周日 0）
]

function expandCronField(field, idx) {
  const [lo, hi] = CRON_RANGES[idx]
  const names = idx === 3 ? MONTH_NAMES : idx === 4 ? DOW_NAMES : null
  const parseToken = (t) => {
    let v
    if (names) {
      const ni = names.indexOf(t.slice(0, 3))
      if (ni >= 0) return ni
    }
    if (/^\d+$/.test(t)) return parseInt(t, 10)
    throw new Error(`字段值「${t}」不合法`)
  }
  const set = new Set()
  const restricted = field !== '*'
  for (const part of field.split(',')) {
    const m = part.match(/^(\*|\d+|[a-z]{3})(?:-(\*|\d+|[a-z]{3}))?(?:\/(\d+))?$/i)
    if (!m) throw new Error(`「${part}」无法解析`)
    let start = m[1] === '*' ? lo : parseToken(m[1])
    let end
    if (!m[2]) end = m[1] === '*' ? hi : start
    else end = m[2] === '*' ? hi : parseToken(m[2])
    if (idx === 4 && end === 7) end = 0
    if (start < lo || (start > hi && !(idx === 4 && start === 7)) || end > hi || end < start) {
      throw new Error(`「${part}」超出第 ${idx + 1} 字段范围（${lo}-${hi}）`)
    }
    const step = m[3] ? parseInt(m[3], 10) : 1
    if (step < 1) throw new Error(`步长「${m[3]}」不合法`)
    for (let v = start; v <= end; v += step) set.add(idx === 4 && v === 7 ? 0 : v)
  }
  return { set, restricted }
}

function parseCron(expr) {
  const parts = String(expr || '').trim().split(/\s+/)
  if (parts.length !== 5) throw new Error('需要 5 个字段：分 时 日 月 周')
  const fields = parts.map((p, i) => expandCronField(p, i))
  return {
    minutes: fields[0].set,
    hours: fields[1].set,
    days: fields[2],
    months: fields[3].set,
    dows: fields[4]
  }
}

function cronDayMatch(parsed, d) {
  const domOk = parsed.days.set.has(d.getDate())
  const dowOk = parsed.dows.set.has(d.getDay())
  // Vixie cron：日与周都受限时为 OR 语义
  if (parsed.days.restricted && parsed.dows.restricted) return domOk || dowOk
  if (parsed.days.restricted) return domOk
  if (parsed.dows.restricted) return dowOk
  return true
}

// 从 from 起枚举接下来 count 次运行时间（分钟级步进，上限 366 天）
function cronNextRuns(expr, from = new Date(), count = 5) {
  const p = parseCron(expr)
  const out = []
  const d = new Date(from.getTime())
  d.setSeconds(0, 0)
  d.setMinutes(d.getMinutes() + 1)
  const limit = new Date(from.getTime() + 366 * 86400 * 1000)
  while (out.length < count && d < limit) {
    if (p.months.has(d.getMonth() + 1) && p.hours.has(d.getHours()) && p.minutes.has(d.getMinutes()) && cronDayMatch(p, d)) {
      out.push(new Date(d.getTime()))
    }
    d.setMinutes(d.getMinutes() + 1)
  }
  return out
}

const DOW_ZH = ['周日', '周一', '周二', '周三', '周四', '周五', '周六']
const pad2 = (n) => String(n).padStart(2, '0')

// 常见形态的中文概要描述（不追求全语法自然语言，兜底给字段明细）
function cronDescribe(expr) {
  const p = parseCron(expr)
  const [minF, hourF, domF, monF, dowF] = expr.trim().split(/\s+/)
  const everyMin = minF === '*' && hourF === '*' && domF === '*' && monF === '*' && dowF === '*'
  if (everyMin) return '每分钟执行一次'
  const stepMin = minF.match(/^\*\/(\d+)$/)
  if (stepMin && hourF === '*' && domF === '*' && monF === '*' && dowF === '*') {
    return `每隔 ${stepMin[1]} 分钟执行一次`
  }
  const stepHour = hourF.match(/^\*\/(\d+)$/)
  if (stepHour && domF === '*' && monF === '*' && dowF === '*') {
    return minF === '*' ? `每隔 ${stepHour[1]} 小时（每分钟）执行` : `每隔 ${stepHour[1]} 小时，在第 ${[...p.minutes].sort((a, b) => a - b).join('、')} 分钟执行`
  }
  const daily = domF === '*' && monF === '*' && dowF === '*'
  if (daily) {
    const mins = [...p.minutes].sort((a, b) => a - b)
    const hours = [...p.hours].sort((a, b) => a - b)
    if (hours.length === 1) return `每天 ${pad2(hours[0])}:${pad2(mins[0])}${mins.length > 1 ? ` 等 ${mins.length} 个分钟点` : ''} 执行`
    return `每天 ${hours.map(h => pad2(h)).join('、')} 点的指定分钟执行`
  }
  if (dowF !== '*' && domF === '*' && monF === '*') {
    const dows = [...p.dows.set].sort((a, b) => a - b).map(d => DOW_ZH[d]).join('、')
    const hours = [...p.hours].sort((a, b) => a - b)
    return `每${dows.includes('、') ? '' : ''}${dows}的 ${hours.join('、')} 点执行`
  }
  if (domF !== '*' && monF === '*' && dowF === '*') {
    const days = [...p.days.set].sort((a, b) => a - b).join('、')
    return `每月 ${days} 日执行`
  }
  return '自定义组合（见下方字段明细）'
}

/* ============ chmod 计算 ============ */

function chmodToOctal(perms) {
  const bit = (o, k) => (perms[o][k] ? 1 : 0)
  const tri = (o) => bit(o, 'r') * 4 + bit(o, 'w') * 2 + bit(o, 'x')
  return tri('owner') * 100 + tri('group') * 10 + tri('other')
}

function chmodFromOctal(n) {
  const mk = (v) => ({ r: !!(v & 4), w: !!(v & 2), x: !!(v & 1) })
  return {
    owner: mk(Math.floor(n / 100) % 10),
    group: mk(Math.floor(n / 10) % 10),
    other: mk(n % 10)
  }
}

function chmodSymbolic(perms) {
  const seg = (o) => (perms[o].r ? 'r' : '-') + (perms[o].w ? 'w' : '-') + (perms[o].x ? 'x' : '-')
  return seg('owner') + seg('group') + seg('other')
}

/* ============ 随机（安全随机源 + 拒绝采样消除取模偏差） ============ */

function randBelow(max) {
  const range = 0x100000000 - (0x100000000 % max)
  const buf = new Uint32Array(1)
  for (;;) {
    crypto.getRandomValues(buf)
    if (buf[0] < range) return buf[0] % max
  }
}

function genPassword(length, pool) {
  let out = ''
  for (let i = 0; i < length; i++) out += pool[randBelow(pool.length)]
  return out
}

/* ============ 文本统计（中文感知） ============ */

function textStats(str) {
  const s = String(str ?? '')
  const chars = [...s]
  const cjk = chars.filter(c => /[\u4e00-\u9fff\u3400-\u4dbf]/.test(c)).length
  const latinWords = (s.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length
  return {
    characters: chars.length,
    noSpace: chars.filter(c => !/\s/.test(c)).length,
    cjk,
    words: latinWords + cjk,
    lines: s === '' ? 0 : s.split('\n').length,
    paragraphs: s.split(/\n\s*\n/).filter(x => x.trim()).length,
    bytes: new TextEncoder().encode(s).length
  }
}

/* ============ JSON 错误定位（V8 报错消息兼容） ============ */

function jsonErrorInfo(e, source) {
  const msg = e instanceof Error ? e.message : String(e)
  const src = String(source ?? '')
  const posFromIndex = (pos) => {
    const before = src.slice(0, pos)
    const line = before.split('\n').length
    const col = pos - before.lastIndexOf('\n')
    return { line, col }
  }
  const posMatch = msg.match(/position (\d+)/i)
  if (posMatch) return { message: msg, ...posFromIndex(+posMatch[1]) }
  const lcMatch = msg.match(/line (\d+) column (\d+)/i)
  if (lcMatch) return { message: msg, line: +lcMatch[1], col: +lcMatch[2] }
  // 新版 V8 消息不带 position，但会把出错的源码片段放在引号里：拿片段反查原文位置
  const snip = msg.match(/"([\s\S]{1,80}?)" (?:is not valid JSON|in JSON)/)
  if (snip) {
    const idx = src.indexOf(snip[1])
    if (idx >= 0) return { message: msg, ...posFromIndex(idx) }
  }
  return { message: msg, line: null, col: null }
}

      { key: 'b', label: '新版', type: 'textarea', ph: '第一行\n第二行改了', value: '第一行\n第二行改了\n新增行' }

      const d = lineDiff(v.a, v.b);
      const ops = (d && d.ops) || [];

      const n = +String(v.src).trim();

/* ---------- 渲染 ---------- */
let cur = 'json';
function renderList(filter = '') {
  const f = filter.trim().toLowerCase();
  $('list').innerHTML = TOOLS
    .filter(t => !f || (t.name + t.desc + t.cat).toLowerCase().includes(f))
    .map(t => `<button data-id="${t.id}" class="${t.id === cur ? 'on' : ''}">${t.name}</button>`).join('');
}
function renderMain() {
  const t = TOOLS.find(x => x.id === cur);
  const fields = t.fields.map(f => `
    <div class="field">
      <label>${f.label}</label>
      ${f.type === 'textarea'
        ? `<textarea id="f_${f.key}" placeholder="${f.ph || ''}">${f.value || ''}</textarea>`
        : `<input type="${f.type}" id="f_${f.key}" value="${f.value || ''}" placeholder="${f.ph || ''}" />`}
    </div>`).join('');
  $('main').innerHTML = `
    <h2>${t.name}</h2><p class="desc">${t.desc}</p>
    <div class="grid">${fields}</div>
    <div class="row" id="acts"></div>
    <pre id="out" hidden></pre>
    <div class="row"><button class="btn ghost sm" id="copy">复制结果</button></div>`;
  $('acts').innerHTML = t.actions.map(a => `<button class="btn${a.id === t.actions[0].id ? '' : ' ghost'}" data-act="${a.id}">${a.name}</button>`).join('');
  $('acts').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    exec(t, b.dataset.act);
  });
  $('copy').addEventListener('click', () => {
    const el = $('out');
    if (el && !el.hidden) navigator.clipboard.writeText(el.textContent);
  });
}
function vals(t) {
  const v = {};
  t.fields.forEach(f => { const el = $('f_' + f.key); v[f.key] = el ? el.value : '' });
  return v;
}
async function exec(t, act) {
  const out = $('out');
  out.hidden = false; out.className = ''; out.textContent = '…';
  try {
    const v = vals(t);
    const r = await t.run(act, v);
    out.textContent = typeof r === 'string' ? r : JSON.stringify(r, null, 2);
  } catch (e) {
    out.className = 'err';
    let msg = String(e && e.message || e);
    if (t.id === 'json' && /position|Unexpected|JSON/.test(msg) && typeof jsonErrorInfo === 'function') {
      try { const info = jsonErrorInfo(e, vals(t).src); if (info) msg += '\n' + JSON.stringify(info) } catch {}
    }
    out.textContent = '出错了：' + msg;
  }
}
$('list').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  cur = b.dataset.id; renderList($('q').value); renderMain();
});
$('q').addEventListener('input', (e) => renderList(e.target.value));
renderList(); renderMain();
